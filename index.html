<body>

<div class="container">

    <header>
        <h1>📄 DOI to BibTeX Converter</h1>

        <p class="subtitle">
            Convert DOI lists into BibTeX entries for Overleaf and LaTeX.
        </p>
    </header>

    <div class="grid">

        <section class="card">

            <h2>Input DOIs</h2>

            <p class="hint">
                One DOI per line:
            </p>

            <pre>citation_key | doi</pre>

            <textarea
                id="input"
                placeholder="franco2023 | 10.3390/cells13010037
smith2022 | https://doi.org/10.xxxx/yyyy">
            </textarea>

            <div class="button-row">

                <button class="primary"
                    onclick="generateBibtex()">
                    Generate .bib
                </button>

                <button onclick="copyBibtex()">
                    Copy
                </button>

                <button onclick="downloadCurrentBib()">
                    Download
                </button>

            </div>

            <p id="status"></p>

        </section>

        <section class="card">

            <h2>Generated BibTeX</h2>

            <textarea
                id="output"
                readonly
                placeholder="Generated bibliography will appear here...">
            </textarea>

        </section>

    </div>

</div>

<script src="script.js"></script>

</body>

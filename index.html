<body>

    <div class="container">

        <h1>DOI to BibTeX Converter</h1>

        <p>
            Paste one DOI per line using:
        </p>

        <pre>citation_key | doi</pre>

        <textarea
            id="input"
            placeholder="franco2023 | 10.3390/cells13010037">
        </textarea>

        <button onclick="generateBibtex()">
            Generate .bib
        </button>

        <button onclick="copyBibtex()">
            Copy to Clipboard
        </button>

        <button onclick="downloadCurrentBib()">
            Download .bib
        </button>

        <p id="status"></p>

        <h2>Generated BibTeX</h2>

        <textarea id="output" readonly></textarea>

    </div>

    <script src="script.js"></script>

</body>
